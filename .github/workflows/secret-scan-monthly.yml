name: Aylık tam geçmiş sır taraması

# ci.yml'deki "sir-taramasi" job'ı yalnızca her push/PR'ın GETİRDİĞİ
# commit'leri tarar (hızlı, gürültüsüz). Bu workflow ise ayda bir TÜM geçmişi
# tarar — asıl amacı force-push ile yeniden yazılmış bir geçmişte ya da
# diff aralığının hesaplanamadığı bir durumda gözden kaçmış bir sırrı
# yakalamak.
#
# BLOKLAMAZ (periyodik denetim, merge kapısı değil): sonuç job özetine
# (Actions > çalıştırma > Summary) yazılır.

on:
  schedule:
    # Her ayın 1'i, 04:00 UTC.
    - cron: '0 4 1 * *'
  # Elle de tetiklenebilsin (ör. bir force-push sonrası beklemeden kontrol).
  workflow_dispatch:

jobs:
  tam-gecmis-taramasi:
    name: Tam geçmiş sır taraması (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # ci.yml'deki "sir-taramasi" job'ı ile AYNI sürüm kullanılmalı.
      GITLEAKS_VERSION: 8.28.0

    steps:
      - name: Checkout
        # fetch-depth: 0 — tüm geçmiş taranacağı için zorunlu.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks kurulumu
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Tüm geçmişi tara
        id: tarama
        # Bulgu varsa gitleaks 1 ile çıkar; job'ı düşürmek YERİNE sonucu
        # özete yazıyoruz (bu bir denetim, kapı değil).
        continue-on-error: true
        run: |
          set +e
          gitleaks git . \
            --redact --no-banner \
            --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Sonucu job özetine yaz
        run: |
          COUNT=0
          if [ -f gitleaks-report.json ]; then
            COUNT=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('gitleaks-report.json','utf8')).length)}catch(e){console.log(0)}")
          fi

          {
            echo "## Aylık tam geçmiş sır taraması"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- gitleaks: \`${GITLEAKS_VERSION}\`"
            echo "- Bulgu sayısı: **${COUNT}**"
            echo ""
            if [ "$COUNT" -eq 0 ]; then
              echo "✅ Geçmişte sır bulunamadı."
            else
              echo "⚠️ **${COUNT} bulgu var — incelenmeli.**"
              echo ""
              echo "Değerler maskelenmiştir (\`--redact\`); dosya/commit bilgisi:"
              echo ""
              echo '| Dosya | Satır | Kural | Commit |'
              echo '| --- | --- | --- | --- |'
              node -e "
                const f = JSON.parse(require('fs').readFileSync('gitleaks-report.json','utf8'));
                for (const x of f.slice(0, 50)) {
                  console.log(\`| \${x.File} | \${x.StartLine} | \${x.RuleID} | \${String(x.Commit).slice(0,10)} |\`);
                }
              "
              echo ""
              echo "Yanlış pozitifse \`.gitleaks.toml\` allowlist'ine ekleyin."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raporu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 30
